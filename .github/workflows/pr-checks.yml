# The gate on every pull request: `npm ci → build → typecheck → test`, on the
# declared `engines` floor and on the active LTS (SPEC 8.6).
#
# `npm test` is the single gate. Nothing here is CI-only, so a green run means
# the same thing a maintainer's green run means, and the two cannot drift.
#
# `npm run build` is not a convenience step and it runs before `npm test`:
# `tests/stdio-server.test.ts` drives the built bundle over stdio, and a fresh
# checkout has no `dist/`. That suite now fails rather than skipping when the
# bundle is missing, so a forgotten build here is a red run rather than the
# repo's only end-to-end test quietly reporting nothing.
name: PR checks

on:
  pull_request:
  workflow_dispatch:

# A superseded run tells nobody anything — the newest push is the one under review.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      # Both versions run to completion: which of the two floors broke is the
      # useful half of the answer, and cancelling the other one throws it away.
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `ci`, not `install`: the committed lockfile is the point, and a cold
      # install that resolves a different tree is a result about a different
      # dependency set (SPEC 8.3).
      - run: npm ci

      - run: npm run build

      - run: npm run typecheck

      - run: npm test
